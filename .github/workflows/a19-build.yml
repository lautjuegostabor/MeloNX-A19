          +#!/usr/bin/env python3
          +"""Patch the pinned upstream MoltenVK source; no fallback to unreviewed anchors."""
          +import sys
          +from pathlib import Path
          +root=Path(sys.argv[1]); p=root/'MoltenVK/MoltenVK/GPUObjects/MVKPipeline.mm'
          +s=p.read_text()
          +def edit(a,b):
          +    global s
          +    if s.count(a)!=1: raise RuntimeError('MoltenVK source changed: '+a[:120])
          +    s=s.replace(a,b)
          +edit('#pragma mark MVKRenderPipelineCompiler', Path(__file__).with_name('metal-archive.inc').read_text()+'\n#pragma mark MVKRenderPipelineCompiler')
          +# Leave default compiler path intact. Archive path copies descriptors, lets Metal fall
          +# back normally on misses, and uses the original completion and timeout machinery.
          +edit('[mtlDev newRenderPipelineStateWithDescriptor: mtlRPLDesc', '''#if TARGET_OS_IOS && !TARGET_OS_SIMULATOR
          +            if (A19ArchiveEnabled()) {
          +                MTLRenderPipelineDescriptor* desc = [mtlRPLDesc copy];
          +                id<MTLBinaryArchive> archive = A19ArchiveReader(mtlDev, true);
          +                if (archive) desc.binaryArchives = @[archive];
          +                [mtlDev newRenderPipelineStateWithDescriptor:desc completionHandler:^(id<MTLRenderPipelineState> ps, NSError* error) {
          +                    if (ps) A19ArchiveRemember(mtlDev, desc, true);
          +                    // Retry without archive on unexpected archive/driver failure.
          +                    if (!ps && archive) {
          +                        MTLRenderPipelineDescriptor* retry = [desc copy]; retry.binaryArchives = nil;
          +                        @synchronized(mtlDev) {
          +                            [mtlDev newRenderPipelineStateWithDescriptor:retry completionHandler:^(id<MTLRenderPipelineState> fresh, NSError* freshError) {
          +                                bool isLate = compileComplete(fresh, freshError); if (isLate) { destroy(); }
          +                            }];
          +                        }
          +                        [retry release];
          +                    } else { bool isLate = compileComplete(ps, error); if (isLate) { destroy(); } }
          +                }];
          +                [desc release];
          +                return;
          +            }
          +#endif
          +            [mtlDev newRenderPipelineStateWithDescriptor: mtlRPLDesc''')
          +edit('[mtlDev newComputePipelineStateWithDescriptor: plDesc', '''#if TARGET_OS_IOS && !TARGET_OS_SIMULATOR
          +            if (A19ArchiveEnabled()) {
          +                MTLComputePipelineDescriptor* desc = [plDesc copy];
          +                id<MTLBinaryArchive> archive = A19ArchiveReader(mtlDev, false);
          +                if (archive) desc.binaryArchives = @[archive];
          +                [mtlDev newComputePipelineStateWithDescriptor:desc options:MTLPipelineOptionNone completionHandler:^(id<MTLComputePipelineState> ps, MTLComputePipelineReflection*, NSError* error) {
          +                    if (ps) A19ArchiveRemember(mtlDev, desc, false);
          +                    if (!ps && archive) {
          +                        MTLComputePipelineDescriptor* retry = [desc copy]; retry.binaryArchives = nil;
          +                        @synchronized(mtlDev) {
          +                            [mtlDev newComputePipelineStateWithDescriptor:retry options:MTLPipelineOptionNone completionHandler:^(id<MTLComputePipelineState> fresh, MTLComputePipelineReflection*, NSError* freshError) {
          +                                bool isLate = compileComplete(fresh, freshError); if (isLate) { destroy(); }
          +                            }];
          +                        }
          +                        [retry release];
          +                    } else { bool isLate = compileComplete(ps, error); if (isLate) { destroy(); } }
          +                }];
          +                [desc release];
          +                return;
          +            }
          +#endif
          +            [mtlDev newComputePipelineStateWithDescriptor: plDesc''')
          +p.write_text(s)
          +print('Applied bounded native archive experiment to MoltenVK 1.4.2')
