          --- /dev/null
          +++ b/distribution/ios/a19/build-moltenvk.sh
          @@ -0,0 +1,40 @@
          +#!/usr/bin/env bash
          +# Run on the Xcode CI host from the checked-out source root. Preserve the original library on failure.
          +set -euo pipefail
          +scripts="$(cd "$(dirname "$0")" && pwd)"
          +root="$PWD"
          +old="$root/src/MeloNX/MeloNX/Dependencies/libMoltenVK.dylib"
          +test -s "$old"
          +work="${RUNNER_TEMP:-$(mktemp -d)}/a19-mvk-142"
          +mkdir -p "$work"
          +if [ ! -d "$work/source/.git" ]; then
          +  git clone --depth 1 --branch v1.4.2 https://github.com/KhronosGroup/MoltenVK.git "$work/source"
          +fi
          +cd "$work/source"
          +test "$(git rev-parse HEAD)" = db66022459ffb663aa2b50f6b018bc2e124f5edf
          +git diff --quiet || { echo 'Unexpected modified upstream source'; exit 1; }
          +# Upstream is the reference build; native archive patch is an explicit build-time experiment.
          +if [ "${A19_BUILD_ARCHIVE:-0}" = 1 ]; then
          +  python3 "$scripts/patch-moltenvk.py" "$PWD"
          +fi
          +command -v cmake >/dev/null || brew install cmake
          +./fetchDependencies --ios
          +make ios
          +# Official iOS dynamic target is a framework; retain the same install name as the bundled library.
          +new="$(find Package/Latest/MoltenVK/dynamic -type f -path '*ios-arm64/MoltenVK.framework/MoltenVK' -print -quit)"
          +if [ -z "$new" ]; then
          +  new="$(find Package/Latest/MoltenVK/dynamic -type f -path '*/MoltenVK.framework/MoltenVK' -print -quit)"
          +fi
          +test -n "$new" && test -s "$new"
          +lipo -verify_arch arm64 "$new"
          +xcrun vtool -show-build "$new" | grep -Eq 'platform (IOS|2)'
          +cp "$new" "$work/libMoltenVK.dylib"
          +install_name_tool -id "$(otool -D "$old" | sed -n '2p' | xargs)" "$work/libMoltenVK.dylib"
          +# A replacement must provide the public/private Vulkan entrypoints used by our current bundle.
          +nm -gU "$old" | awk '{print $NF}' | grep -E '^_vk[A-Z]' | LC_ALL=C sort -u > "$work/old-symbols"
          +nm -gU "$work/libMoltenVK.dylib" | awk '{print $NF}' | LC_ALL=C sort -u > "$work/new-symbols"
          +comm -23 "$work/old-symbols" "$work/new-symbols" | grep -v '^_vkSetMoltenVKConfigurationMVK$' > "$work/missing-symbols" || true
          +if [ -s "$work/missing-symbols" ]; then cat "$work/missing-symbols"; echo 'Incompatible MoltenVK export surface'; exit 1; fi
          +cp "$work/libMoltenVK.dylib" "$old.new"
          +mv "$old.new" "$old"
          +echo 'Installed pinned MoltenVK 1.4.2. Archive patch is opt-in at build time and runtime.'
