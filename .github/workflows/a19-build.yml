          +using System;
          +using System.Collections.Generic;
          +
          +namespace Ryujinx.Cpu.LightningJit.Cache
          +{
          +    // Tracks whole pages, never individual executable bytes. A page cannot be
          +    // reclaimed while a pending or published translation intersects it, or
          +    // until publication has sealed the complete page. The caller additionally
          +    // establishes global dispatch quiescence before reuse.
          +    internal sealed class SharedPageLifetime
          +    {
          +        private readonly int _pageSize;
          +        private readonly int[] _owners;
          +        private readonly bool[] _sealed;
          +        private readonly Dictionary<nint, (int Offset, int Size)> _functions = new();
          +        private readonly HashSet<int> _candidates = new();
          +
          +        public SharedPageLifetime(int size, int pageSize)
          +        {
          +            if (size <= 0 || pageSize <= 0 || size % pageSize != 0) throw new ArgumentException();
          +            _pageSize = pageSize;
          +            _owners = new int[size / pageSize];
          +            _sealed = new bool[_owners.Length];
          +        }
          +
          +        public void Track(nint pointer, int offset, int size)
          +        {
          +            if (offset < 0 || size <= 0 || (long)offset + size > (long)_owners.Length * _pageSize)
          +                throw new ArgumentOutOfRangeException(nameof(offset));
          +            int first = offset / _pageSize, last = (offset + size - 1) / _pageSize;
          +            for (int page = first; page <= last; page++)
          +                if (_sealed[page]) throw new InvalidOperationException("Cannot write a sealed JIT page.");
          +            _functions.Add(pointer, (offset, size));
          +            for (int page = first; page <= last; page++)
          +            {
          +                _owners[page]++;
          +                _candidates.Remove(page);
          +            }
          +        }
          +
          +        public void Seal(int offset, int size)
          +        {
          +            if (offset < 0 || size <= 0 || offset % _pageSize != 0 || size % _pageSize != 0 ||
          +                (long)offset + size > (long)_owners.Length * _pageSize) throw new ArgumentException();
          +            for (int page = offset / _pageSize; page < (offset + size) / _pageSize; page++)
          +            {
          +                _sealed[page] = true;
          +                if (_owners[page] == 0) _candidates.Add(page);
          +            }
          +        }
          +
          +        public void Retire(nint pointer)
          +        {
          +            if (!_functions.Remove(pointer, out var range)) return;
          +            int first = range.Offset / _pageSize, last = (range.Offset + range.Size - 1) / _pageSize;
          +            for (int page = first; page <= last; page++)
          +            {
          +                if (--_owners[page] == 0 && _sealed[page]) _candidates.Add(page);
          +            }
          +        }
          +
          +        public int Reclaim(bool quiescent, Action<int, int> free)
          +        {
          +            if (!quiescent) return 0;
          +            int bytes = 0;
          +            foreach (int page in _candidates)
          +            {
          +                if (_owners[page] != 0 || !_sealed[page]) throw new InvalidOperationException();
          +                free(page * _pageSize, _pageSize);
          +                _sealed[page] = false;
          +                bytes += _pageSize;
          +            }
          +            _candidates.Clear();
          +            return bytes;
          +        }
          +    }
          +}
