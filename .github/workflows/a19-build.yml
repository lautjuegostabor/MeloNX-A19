          +using Ryujinx.Common;
          +using Ryujinx.Common.Logging;
          +using Silk.NET.Vulkan;
          +using System;
          +using System.Runtime.InteropServices;
          +using VkBuffer = Silk.NET.Vulkan.Buffer;
          +using VkFormat = Silk.NET.Vulkan.Format;
          +
          +namespace Ryujinx.Graphics.Vulkan
          +{
          +    // Small executable experiments, independent of any particular game's resources.
          +    // Unsupported capabilities are distinct from failures; no assumption about guest texture lifetime.
          +    internal static unsafe class A19ArchitectureProbes
          +    {
          +        public static void Run(VulkanRenderer gd, Device device)
          +        {
          +            if (!A19Probe.Experiment(8192)) return;
          +            A19Probe.Set(97, -2);
          +            A19Probe.Set(98, -2);
          +            AppleMemoryBudget.SampleHostFeatures();
          +            A19Probe.Set(97, RunOne(() => ImportedBuffer(gd, device)));
          +            A19Probe.Set(98, RunOne(() => TransientAttachment(gd, device)));
          +        }
          +
          +        private static long RunOne(Func<long> test)
          +        {
          +            try { return test(); }
          +            catch (Exception ex)
          +            {
          +                Logger.Warning?.PrintMsg(LogClass.Gpu, "A19 architecture experiment failed: " + ex.Message);
          +                return -1;
          +            }
          +        }
          +
          +        // 0 unsupported, 1 verified GPU-to-CPU shared-memory write, -1 failure.
          +        private static long ImportedBuffer(VulkanRenderer gd, Device device)
          +        {
          +            if (!gd.Capabilities.SupportsHostImportedMemory) return 0;
          +            Vk api = gd.Api;
          +            int bytes = Environment.SystemPageSize;
          +            void* host = NativeMemory.AlignedAlloc((nuint)bytes, (nuint)bytes);
          +            if (host == null) throw new OutOfMemoryException();
          +            VkBuffer buffer = default;
          +            Auto<MemoryAllocation> allocation = null;
          +            bool submitted = false;
          +            try
          +            {
          +                new Span<byte>(host, bytes).Clear();
          +                ExternalMemoryBufferCreateInfo external = new()
          +                {
          +                    SType = StructureType.ExternalMemoryBufferCreateInfo,
          +                    HandleTypes = ExternalMemoryHandleTypeFlags.HostAllocationBitExt,
          +                };
          +                BufferCreateInfo info = new()
          +                {
          +                    SType = StructureType.BufferCreateInfo, PNext = &external,
          +                    Size = (ulong)bytes, Usage = BufferUsageFlags.TransferDstBit | BufferUsageFlags.TransferSrcBit,
          +                    SharingMode = SharingMode.Exclusive,
          +                };
          +                api.CreateBuffer(device, in info, null, out buffer).ThrowOnError();
          +                api.GetBufferMemoryRequirements(device, buffer, out MemoryRequirements requirements);
          +                if (requirements.Size > (ulong)bytes || !gd.HostMemoryAllocator.TryImport(requirements,
          +                    MemoryPropertyFlags.HostVisibleBit | MemoryPropertyFlags.HostCoherentBit, (nint)host, (ulong)bytes)) return 0;
          +                (Auto<MemoryAllocation> imported, ulong offset) = gd.HostMemoryAllocator.GetExistingAllocation((nint)host, (ulong)bytes);
          +                allocation = imported;
          +                MemoryAllocation mem = allocation.GetUnsafe();
          +                api.BindBufferMemory(device, buffer, mem.Memory, mem.Offset + offset).ThrowOnError();
          +                const uint pattern = 0xA19C0FFE;
          +                using (CommandBufferScoped cbs = gd.CommandBufferPool.Rent())
          +                {
          +                    api.CmdFillBuffer(cbs.CommandBuffer, buffer, 0, (ulong)bytes, pattern);
          +                    BufferMemoryBarrier barrier = new()
          +                    {
          +                        SType = StructureType.BufferMemoryBarrier,
          +                        SrcAccessMask = AccessFlags.TransferWriteBit, DstAccessMask = AccessFlags.HostReadBit,
          +                        SrcQueueFamilyIndex = Vk.QueueFamilyIgnored, DstQueueFamilyIndex = Vk.QueueFamilyIgnored,
          +                        Buffer = buffer, Offset = 0, Size = (ulong)bytes,
          +                    };
          +                    api.CmdPipelineBarrier(cbs.CommandBuffer, PipelineStageFlags.TransferBit, PipelineStageFlags.HostBit,
          +                        0, 0, null, 1, in barrier, 0, null);
          +                    submitted = true;
          +                }
          +                lock (gd.QueueLock) api.QueueWaitIdle(gd.Queue).ThrowOnError();
          +                submitted = false;
          +                foreach (uint word in new ReadOnlySpan<uint>(host, bytes / 4)) if (word != pattern) return -1;
          +                return 1;
          +            }
          +            finally
          +            {
          +                if (submitted) { lock (gd.QueueLock) api.QueueWaitIdle(gd.Queue); }
          +                if (buffer.Handle != 0) api.DestroyBuffer(device, buffer, null);
          +                allocation?.DecrementReferenceCount();
          +                NativeMemory.AlignedFree(host);
          +            }
          +        }
          +
          +        // 0 no lazily allocated memory type, 1 submitted transient clear successfully, -1 failure.
          +        private static long TransientAttachment(VulkanRenderer gd, Device device)
          +        {
          +            Vk api = gd.Api;
          +            Image image = default;
          +            ImageView view = default;
          +            DeviceMemory memory = default;
          +            RenderPass pass = default;
          +            Framebuffer framebuffer = default;
          +            bool submitted = false;
          +            const uint extent = 64;
          +            try
          +            {
          +                ImageCreateInfo info = new()
          +                {
          +                    SType = StructureType.ImageCreateInfo, ImageType = ImageType.Type2D,
          +                    Format = VkFormat.R8G8B8A8Unorm, Extent = new Extent3D(extent, extent, 1),
          +                    MipLevels = 1, ArrayLayers = 1, Samples = SampleCountFlags.Count1Bit,
          +                    Tiling = ImageTiling.Optimal, Usage = ImageUsageFlags.TransientAttachmentBit | ImageUsageFlags.ColorAttachmentBit,
          +                    SharingMode = SharingMode.Exclusive, InitialLayout = ImageLayout.Undefined,
          +                };
          +                api.CreateImage(device, in info, null, out image).ThrowOnError();
          +                api.GetImageMemoryRequirements(device, image, out MemoryRequirements req);
          +                int type = gd.MemoryAllocator.FindSuitableMemoryTypeIndex(req.MemoryTypeBits, MemoryPropertyFlags.LazilyAllocatedBit);
          +                if (type < 0) return 0;
          +                MemoryAllocateInfo alloc = new() { SType = StructureType.MemoryAllocateInfo, AllocationSize = req.Size, MemoryTypeIndex = (uint)type };
          +                api.AllocateMemory(device, in alloc, null, out memory).ThrowOnError();
          +                api.BindImageMemory(device, image, memory, 0).ThrowOnError();
          +                ImageViewCreateInfo viewInfo = new()
          +                {
          +                    SType = StructureType.ImageViewCreateInfo, Image = image, ViewType = ImageViewType.Type2D,
          +                    Format = info.Format, SubresourceRange = new ImageSubresourceRange(ImageAspectFlags.ColorBit, 0, 1, 0, 1),
          +                };
          +                api.CreateImageView(device, in viewInfo, null, out view).ThrowOnError();
          +                AttachmentDescription attachment = new(0, info.Format, SampleCountFlags.Count1Bit,
          +                    AttachmentLoadOp.Clear, AttachmentStoreOp.DontCare, AttachmentLoadOp.DontCare, AttachmentStoreOp.DontCare,
          +                    ImageLayout.Undefined, ImageLayout.ColorAttachmentOptimal);
          +                AttachmentReference reference = new(0, ImageLayout.ColorAttachmentOptimal);
          +                SubpassDescription subpass = new() { PipelineBindPoint = PipelineBindPoint.Graphics, ColorAttachmentCount = 1, PColorAttachments = &reference };
          +                RenderPassCreateInfo passInfo = new()
          +                {
          +                    SType = StructureType.RenderPassCreateInfo, AttachmentCount = 1, PAttachments = &attachment,
          +                    SubpassCount = 1, PSubpasses = &subpass,
          +                };
          +                api.CreateRenderPass(device, in passInfo, null, out pass).ThrowOnError();
          +                FramebufferCreateInfo fb = new()
