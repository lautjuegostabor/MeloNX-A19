          +        status = "Options applied for next game."
          +    }
          +    private func metadata() -> [String: String] {
          +        let info = ProcessInfo.processInfo
          +        var result = ["model": UIDevice.modelName, "os": UIDevice.current.systemVersion,
          +                      "physicalMemoryBytes": String(info.physicalMemory), "processorCount": String(info.processorCount),
          +                      "activeProcessorCount": String(info.activeProcessorCount), "pageBytes": String(getpagesize()),
          +                      "thermalAtStart": String(info.thermalState.rawValue)]
          +        if let device = MTLCreateSystemDefaultDevice() {
          +            result["metalDevice"] = device.name
          +            result["metalArgumentBuffersTierRaw"] = String(device.argumentBuffersSupport.rawValue)
          +            result["metalMaxBufferLength"] = String(device.maxBufferLength)
          +            result["metalCounterSets"] = device.counterSets?.map(\.name).joined(separator: ",") ?? "unavailable"
          +        }
          +        for key in ["hw.cachelinesize", "hw.l1icachesize", "hw.l1dcachesize", "hw.l2cachesize", "hw.l3cachesize", "hw.optional.arm.FEAT_LSE", "hw.optional.arm.FEAT_LRCPC", "hw.optional.arm.FEAT_FP16", "hw.optional.arm.FEAT_DotProd", "hw.optional.arm.FEAT_MOPS"] {
          +            var value: UInt64 = 0; var size = MemoryLayout<UInt64>.size
          +            let code = key.withCString { sysctlbyname($0, &value, &size, nil, 0) }
          +            if code == 0 { result[key] = String(value) }
          +        }
          +        return result
          +    }
          +    func benchmark() {
          +        guard !running && !benchmarking && !RyujinxController.shared.isRunning.isRunning() else { return }
          +        benchmarking = true; status = "Measuring CPU and Metal…"; hardware = metadata()
          +        Task {
          +            let values = await Task.detached(priority: .userInitiated) {
          +                var data = A19Hardware.cpuBench()
          +                data.merge(A19Hardware.gpuBench()) { _,new in new }
          +                return data
          +            }.value
          +            benchmarks = values
          +            hardware["thermalAfterBenchmark"] = String(ProcessInfo.processInfo.thermalState.rawValue)
          +            benchmarkHardware = hardware
          +            benchmarking = false; status = "Benchmark finished: \(values.count) measurements."
          +            selected = ["argumentBuffers":argumentBuffers,"commandLimit":commandLimit,"shaderWorkers":shaderWorkers,"jitPadCalls":jitPadCalls]
          +            samples = []; sampleCount = 0; gameSettings = [:]; gameStartSeconds = nil; gameEndSeconds = nil; gameExitCode = nil; writeReport()
