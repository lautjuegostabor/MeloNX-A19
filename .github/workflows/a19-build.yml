          +namespace {
          +constexpr uint64_t A19ArchiveMaxBytes = 64ull * 1024 * 1024;
          +constexpr uint64_t A19ArchiveMinHeadroom = 1024ull * 1024 * 1024;
          +static bool A19ArchiveEnabled() {
          +    const char* v = getenv("A19_NATIVE_ARCHIVE");
          +    return v && (v[0] == '1' && v[1] == '\0');
          +}
          +static NSURL* A19ArchiveURL(id<MTLDevice> dev, bool render) {
          +    NSFileManager* fm = [NSFileManager defaultManager];
          +    NSURL* cache = [[fm URLsForDirectory:NSCachesDirectory inDomains:NSUserDomainMask] firstObject];
          +    if (!cache) return nil;
          +    NSOperatingSystemVersion os = [[NSProcessInfo processInfo] operatingSystemVersion];
          +    NSString* gpu = [[dev.name componentsSeparatedByCharactersInSet:[[NSCharacterSet alphanumericCharacterSet] invertedSet]] componentsJoinedByString:@"_"];
          +    NSString* name = [NSString stringWithFormat:@"mvk142-archive1-%@-%ld-%ld-%ld", gpu, (long)os.majorVersion, (long)os.minorVersion, (long)os.patchVersion];
          +    NSURL* dir = [[cache URLByAppendingPathComponent:@"A19MetalArchive" isDirectory:YES] URLByAppendingPathComponent:name isDirectory:YES];
          +    if (![fm createDirectoryAtURL:dir withIntermediateDirectories:YES attributes:nil error:nullptr]) return nil;
          +    return [dir URLByAppendingPathComponent:render ? @"render.metalarc" : @"compute.metalarc"];
          +}
          +static id<MTLBinaryArchive> A19OpenArchive(id<MTLDevice> dev, NSURL* url, bool create) {
          +    if (!url) return nil;
          +    NSDictionary* attrs = [[NSFileManager defaultManager] attributesOfItemAtPath:url.path error:nullptr];
          +    unsigned long long bytes = [attrs fileSize];
          +    MTLBinaryArchiveDescriptor* desc = [MTLBinaryArchiveDescriptor new];
          +    if (bytes > 0 && bytes <= A19ArchiveMaxBytes) desc.url = url;
          +    if (!desc.url && !create) { [desc release]; return nil; }
          +    NSError* err = nil;
          +    id<MTLBinaryArchive> archive = [dev newBinaryArchiveWithDescriptor:desc error:&err];
          +    if (!archive && create && desc.url) { desc.url = nil; archive = [dev newBinaryArchiveWithDescriptor:desc error:&err]; }
          +    [desc release];
          +    return archive; // retained
          +}
          +static id<MTLBinaryArchive> A19ArchiveReader(id<MTLDevice> dev, bool render) {
          +    if (!A19ArchiveEnabled() || os_proc_available_memory() < A19ArchiveMinHeadroom) return nil;
          +    // Called under MoltenVK's original device monitor. iOS has a single system Metal device.
          +    static id<MTLBinaryArchive> readers[2] = { nil, nil };
          +    static bool attempted[2] = { false, false };
          +    int idx = render ? 0 : 1;
          +    if (!attempted[idx]) {
          +        attempted[idx] = true;
          +        readers[idx] = A19OpenArchive(dev, A19ArchiveURL(dev, render), false);
          +    }
          +    return readers[idx];
          +}
          +static std::atomic<unsigned> a19ArchivePending{0};
          +static std::atomic<unsigned> a19ArchiveAttempts{0};
          +static dispatch_queue_t A19ArchiveQueue() {
          +    static dispatch_queue_t q = dispatch_queue_create("org.melonx.a19.metalarchive", dispatch_queue_attr_make_with_qos_class(DISPATCH_QUEUE_SERIAL, QOS_CLASS_UTILITY, 0));
