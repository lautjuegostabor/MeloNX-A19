          +                id<MTLBinaryArchive> archive = A19OpenArchive(dev, url, true);
          +                if (archive) {
          +                    NSError* err = nil;
          +                    bool ok = render ? [archive addRenderPipelineFunctionsWithDescriptor:(MTLRenderPipelineDescriptor*)copied error:&err]
          +                                     : [archive addComputePipelineFunctionsWithDescriptor:(MTLComputePipelineDescriptor*)copied error:&err];
          +                    if (ok && os_proc_available_memory() >= A19ArchiveMinHeadroom) {
