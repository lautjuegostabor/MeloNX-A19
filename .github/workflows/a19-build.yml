name: Build MeloNX A19 experimental (unsigned)
on:
  push:
    branches: [a19-experimental]
    paths: ['a19-overlay.zip', '.github/workflows/a19-build.yml']
  workflow_dispatch:
concurrency:
  group: a19-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        working-directory: source
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f925129209afd55927a0201d82285b8fa4b7ba30
          path: source
          persist-credentials: false
      - name: Verify and apply experimental overlay
        run: |
          echo 'dfd0e7c1bde9029aec5c2d2347086a15342995da135fec54842587796e04400f  ../a19-overlay.zip' | shasum -a 256 -c -
