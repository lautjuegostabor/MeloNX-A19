          +// A19 optional native archive experiment for MoltenVK 1.4.2, iOS only.
          +// Reader is immutable. Writer is serialized on a utility queue and never used for lookup.
          +// No more than one pending descriptor and 128 attempted additions per process.
          +#include <TargetConditionals.h>
          +#if TARGET_OS_IOS && !TARGET_OS_SIMULATOR
          +#include <os/proc.h>
          +#include <atomic>
          +#include <dispatch/dispatch.h>
          +#include <stdio.h>
          +#include <stdlib.h>
