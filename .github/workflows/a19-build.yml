      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json
      - name: Select Xcode 27 and tools
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet
          if ! command -v rustup >/dev/null; then brew install rustup; fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Preflight reviewed sources and toolchain fingerprint
        id: preflight
        run: |
          for f in src/MeloNX/MeloNX/Common/JIT/{MeloNXJITCoordinator,OnDevicePairing,MeloNXBuiltInJIT}.swift src/MeloNX/MeloNX/Core/RyujinxController.swift distribution/ios/a19/MeloNXJITHelper/MeloNXJITHelper.swift; do
            xcrun swiftc -frontend -parse "$f"
          done
          python3 -m py_compile distribution/ios/a19/validate-bundle.py
          bash -n distribution/ios/a19/build-dependencies.sh
          bash -n distribution/ios/a19/package.sh
          echo "fingerprint=$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; dotnet --version; rustc --version; uname -m; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-a19-${{ runner.os }}-${{ hashFiles('source/global.json', 'source/**/*.csproj', 'source/**/Directory.Packages.props', 'source/nuget.config') }}
      - name: Restore compiled native helpers
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/distribution/ios/a19/build/libhusk_rppairing.a
            source/distribution/ios/a19/build/LICENSES-rppairing-crates.txt
            source/distribution/ios/a19/build/StikJIT.framework
            source/distribution/ios/a19/build/helper/Build/Products/Release-iphoneos/MeloNXJITHelper.appex
          key: native-a19-v1-${{ steps.preflight.outputs.fingerprint }}-${{ hashFiles('source/distribution/ios/a19/vendor/**', 'source/distribution/ios/a19/MeloNXJITHelper/**', 'source/distribution/ios/a19/project.yml', 'source/distribution/ios/a19/build-dependencies.sh') }}
      - name: Compile native pairing and StikJIT helper
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: distribution/ios/a19/build-dependencies.sh
      - name: Validate native products
        run: |
          A=distribution/ios/a19/build
          test -s "$A/LICENSES-rppairing-crates.txt"
          test -s "$A/StikJIT.framework/universal.js"
          lipo -verify_arch arm64 "$A/libhusk_rppairing.a"
          lipo -verify_arch arm64 "$A/StikJIT.framework/StikJIT"
          lipo -verify_arch arm64 "$A/helper/Build/Products/Release-iphoneos/MeloNXJITHelper.appex/MeloNXJITHelper"
      - name: Save compiled native helpers before host build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            source/distribution/ios/a19/build/libhusk_rppairing.a
            source/distribution/ios/a19/build/LICENSES-rppairing-crates.txt
            source/distribution/ios/a19/build/StikJIT.framework
            source/distribution/ios/a19/build/helper/Build/Products/Release-iphoneos/MeloNXJITHelper.appex
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Restore compiled Ryujinx core
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: source/src/Ryujinx.Library/bin/Release/net10.0/ios-arm64/native/Ryujinx.Library.dylib
          key: core-a19-v1-${{ steps.preflight.outputs.fingerprint }}-f925129209afd55927a0201d82285b8fa4b7ba30-${{ hashFiles('source/distribution/ios/build.sh') }}
      - name: Compile Ryujinx core if needed
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: distribution/ios/build.sh
      - name: Validate core and mark ready for Xcode
        run: |
          lipo -verify_arch arm64 src/Ryujinx.Library/bin/Release/net10.0/ios-arm64/native/Ryujinx.Library.dylib
          touch .ci-core-cache-hit
      - name: Save compiled core before host build
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/src/Ryujinx.Library/bin/Release/net10.0/ios-arm64/native/Ryujinx.Library.dylib
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Archive MeloNX
        run: |
          xcodebuild archive -project src/MeloNX/MeloNX.xcodeproj -scheme MeloNX \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/MeloNX.xcarchive CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            SWIFT_OPTIMIZATION_LEVEL=-Onone
      - name: Assemble and validate unsigned IPA
        run: distribution/ios/a19/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MeloNX-A19-unsigned
          path: source/build/MeloNX-A19-unsigned.ipa
          if-no-files-found: error
