          --- /dev/null
          +++ b/distribution/ios/a19/engine-tests/Program.cs
          @@ -0,0 +1,105 @@
          +using Ryujinx.Common;
          +using Ryujinx.Cpu.LightningJit.Cache;
          +using Ryujinx.Graphics.Vulkan;
          +
          +static void Check(bool condition, string message)
          +{
          +    if (!condition) throw new Exception(message);
          +}
          +
          +// Test the actual sparse storage and range implementation, not a reimplementation.
          +A19Probe.Enable(1);
          +const int size = 17 * 4096 + 51;
          +var dense = new PendingBufferData(size, false);
          +var sparse = new PendingBufferData(size, true);
          +BufferMirrorRangeList ranges = default;
          +Random rng = new(19);
          +byte[] original = new byte[size];
          +rng.NextBytes(original);
          +for (int i = 0; i < 1000; i++)
          +{
          +    int offset = rng.Next(size);
          +    int length = rng.Next(1, Math.Min(size - offset, 10000) + 1);
          +    if ((i % 3) == 0)
          +    {
          +        ranges.Remove(offset, length);
          +        sparse.Trim(offset, length, ranges);
          +    }
          +    else
          +    {
          +        byte[] input = new byte[length];
          +        rng.NextBytes(input);
          +        dense.Write(offset, input);
          +        sparse.Write(offset, input);
          +        ranges.Add(offset, length);
          +        Check(sparse.Read(offset, length).SequenceEqual(input), "Sparse write/read mismatch");
          +    }
          +    byte[] a = new byte[size], b = new byte[size];
          +    ranges.FillData(original, dense, 0, a);
          +    ranges.FillData(original, sparse, 0, b);
          +    Check(a.AsSpan().SequenceEqual(b), "Sparse and dense merges differ");
          +}
          +ranges.Clear();
          +sparse.TrimAll(ranges);
          +Check(A19Probe.Read(70) == A19Probe.Read(71), "Sparse retained-byte accounting differs");
          +
          +// The production allocator must coalesce 16KiB allocations, including page padding.
          +const int page = 16 * 1024;
          +CacheMemoryAllocator allocator = new(8 * page);
          +var entries = new List<(int Offset, int Size)>();
          +for (int i = 0; i < 1200; i++)
          +{
          +    if (entries.Count > 0 && rng.Next(2) == 0)
          +    {
          +        int index = rng.Next(entries.Count);
          +        var entry = entries[index];
          +        allocator.Free(entry.Offset, entry.Size);
          +        entries.RemoveAt(index);
          +    }
          +    else
          +    {
          +        int n = (rng.Next(1, 4)) * page;
          +        int offset = allocator.Allocate(n);
          +        if (offset >= 0)
          +        {
          +            Check(offset % page == 0, "Unaligned page");
          +            Check(!entries.Any(x => offset < x.Offset + x.Size && x.Offset < offset + n), "Overlapping JIT allocations");
          +            entries.Add((offset, n));
          +        }
          +    }
          +}
          +foreach (var entry in entries) allocator.Free(entry.Offset, entry.Size);
          +Check(allocator.Allocate(8 * page) == 0, "Allocator did not coalesce");
          +// ForceAllocation must work inside a free range and reject overlaps in Release.
          +CacheMemoryAllocator interior = new(4 * page);
          +interior.ForceAllocation(page, page);
          +Check(interior.Allocate(page) == 0, "Interior reservation damaged prefix");
          +Check(interior.Allocate(page) == 2 * page, "Interior reservation damaged suffix");
          +bool rejected = false;
          +try { interior.ForceAllocation(page, 1); } catch (InvalidOperationException) { rejected = true; }
          +Check(rejected, "Overlap accepted in Release");
