          +using System;
          +using System.Diagnostics;
          +using System.Runtime.InteropServices;
          +using System.Threading;
          +
          +namespace Ryujinx.Common
          +{
          +    // Single process-wide sample. Unknown is distinct from zero available bytes.
          +    public static class AppleMemoryBudget
          +    {
          +        public const long MiB = 1024L * 1024;
          +        private static readonly object SampleLock = new();
          +        private static long _nextSample;
          +        private static long _available = -1;
          +        private static int _thermal;
          +        private static long _warningUntil;
          +        public static void NotifyMemoryWarning() => Interlocked.Exchange(ref _warningUntil, Stopwatch.GetTimestamp() + 5 * Stopwatch.Frequency);
          +        private static bool _unavailable;
          +
          +        [DllImport("/usr/lib/libSystem.B.dylib", EntryPoint = "os_proc_available_memory")]
          +        private static extern nuint AvailableProcessMemory();
          +
          +        [DllImport("/usr/lib/libSystem.B.dylib", EntryPoint = "sysctlbyname")]
          +        private static extern int SysctlFeature(string name, out int value, ref nuint size, nint newValue, nuint newSize);
          +
          +        public static void SampleHostFeatures()
          +        {
          +            if (!OperatingSystem.IsIOS()) return;
          +            string[] names = ["hw.optional.arm.FEAT_LSE", "hw.optional.arm.FEAT_LRCPC", "hw.optional.arm.FEAT_FP16", "hw.optional.arm.FEAT_DotProd", "hw.optional.arm.FEAT_I8MM"];
          +            long result = 0;
          +            for (int i = 0; i < names.Length; i++)
          +            {
          +                nuint size = sizeof(int);
          +                if (SysctlFeature(names[i], out int value, ref size, 0, 0) == 0 && size == sizeof(int) && value != 0) result |= 1L << i;
          +            }
          +            A19Probe.Set(99, result);
          +        }
          +
          +        public static void SetThermal(int state)
          +        {
          +            int value = Math.Clamp(state, 0, 3);
          +            Volatile.Write(ref _thermal, value);
          +            A19Probe.Set(75, value);
          +        }
          +
          +        public static long AvailableBytes
          +        {
          +            get
          +            {
          +                if (!OperatingSystem.IsIOS()) return -1;
          +                long now = Stopwatch.GetTimestamp();
          +                if (now >= Volatile.Read(ref _nextSample))
          +                {
          +                    lock (SampleLock)
          +                    {
          +                        if (now >= _nextSample)
          +                        {
          +                            if (!_unavailable)
          +                            {
          +                                try { Volatile.Write(ref _available, (long)AvailableProcessMemory()); }
          +                                catch (EntryPointNotFoundException) { _unavailable = true; }
          +                                catch (DllNotFoundException) { _unavailable = true; }
          +                            }
          +                            A19Probe.Set(74, _available);
          +                            Volatile.Write(ref _nextSample, now + Math.Max(1L, Stopwatch.Frequency / 4));
          +                        }
          +                    }
          +                }
          +                return Volatile.Read(ref _available);
          +            }
          +        }
          +
          +        public static int Pressure
          +        {
          +            get
          +            {
          +                long bytes = AvailableBytes;
          +                int level = bytes < 0 ? 1 : bytes < 128 * MiB ? 3 : bytes < 256 * MiB ? 2 : bytes < 512 * MiB ? 1 : 0;
          +                if (Stopwatch.GetTimestamp() < Volatile.Read(ref _warningUntil)) level = Math.Max(level, 2);
          +                A19Probe.Set(76, level);
          +                return level;
          +            }
          +        }
          +
          +        public static int CompileLimit(int maximum)
          +        {
          +            if (!A19Probe.Experiment(256)) return maximum;
          +            int pressure = Math.Max(Pressure, Volatile.Read(ref _thermal) >= 2 ? 2 : 0);
          +            return Math.Max(1, Math.Min(maximum, pressure >= 2 ? 1 : pressure == 1 ? 2 : 3));
          +        }
          +    }
          +}
