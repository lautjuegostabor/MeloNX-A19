name: A19Core exact checkpoint - iPhone 17
on:
  workflow_dispatch:
  push:
    branches: [a19core-native-integration]
    paths: ['A19Core-source-transfer.txt', '.github/workflows/a19core-checkpoint-build.yml']
permissions:
  contents: read
concurrency:
  group: a19core-checkpoint-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          sparse-checkout: |
            A19Core-source-transfer.txt
            a19core/fixes/import-audit.patch.gz.b64
            a19core/fixes/stability-stage2.json.gz.b64
            a19core/fixes/upstream-parity.json.gz.b64
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: jhaizhou-ops/S2Arm
          ref: 39d35671a57ee30d5f528c13d206fd6309a84b8f
          path: upstream
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and restore exact A19Core source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 39d35671a57ee30d5f528c13d206fd6309a84b8f
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path("upstream")
          payload = "".join(pathlib.Path("project/A19Core-source-transfer.txt").read_text().split()).encode()
          assert hashlib.sha256(payload).hexdigest() == "ab2f034033da7a3ac725bfedee4236c47418c5af238bc92f78ee2807840cbf82", "Incorrect transfer payload"
          transfer = json.loads(zlib.decompress(base64.b64decode(payload, validate=True)))
          manifest = json.loads(transfer["manifest"])
          expected = manifest["modified"] | manifest["added"]
          assert len(expected) == 58 and set(expected) == set(transfer["ops"])
          def safe_path(name):
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and ".." not in p.parts
              return root / p
          # Read all originals before applying any edits.
          reconstructed = {}
          for name, (source, edits, digest) in transfer["ops"].items():
              assert digest == expected[name]
              if source:
                  lines = safe_path(source).read_bytes().splitlines(True)
                  for i, j, encoded in reversed(edits):
                      lines[i:j] = [base64.b64decode(encoded, validate=True)]
                  value = b"".join(lines)
              else:
                  value = base64.b64decode(edits, validate=True)
              assert hashlib.sha256(value).hexdigest() == digest, name
              reconstructed[name] = value
          assert manifest["removed"] == ["runtime/src/imgpack.c"]
          for name in manifest["removed"]:
              safe_path(name).unlink()
          for name, value in reconstructed.items():
              p = safe_path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(value)
          (root / "A19CORE-WORK-STATE.json").write_text(transfer["manifest"])
          for name, digest in expected.items():
              assert hashlib.sha256(safe_path(name).read_bytes()).hexdigest() == digest
          print("Restored exact production checkpoint; 58 per-file hashes verified.")
          PY
      - name: Apply verified import and converter audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,base64,gzip,pathlib
          transfer=pathlib.Path("project/a19core/fixes/import-audit.patch.gz.b64").read_bytes()
          assert hashlib.sha256(transfer).hexdigest()=="c407e380c2a96ca7425b6742c14e7cc2f6b42b71693484839bc080945f603293"
          patch=gzip.decompress(base64.b64decode(transfer.strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=="6ade5a79d8a8f7516c8ec38626baab79c5b7f8271071f1846744dca5311972d7"
          pathlib.Path("import-audit.patch").write_bytes(patch)
          PY
          (cd upstream && git apply --check ../import-audit.patch && git apply ../import-audit.patch)
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("upstream")
          expected={
            "a19-tests/ConverterTests.csproj":"a46b9360c4508bab076ae71d7304636ff93b4ba7a334bf18f3ef848f5efa9694",
            "a19-tests/converter-checkpoint.cs":"1579b439c9731c2f05abe1782f9dbd7fd56046c24ae497a79f0b91063cf469e5",
            "ios/A19Library.m":"e944435288e7d0259744641762078171e87bbfb25527b5e02891956838a6963e",
            "services/aot/A19Converter/ConvertJob.cs":"7bcfbdb9b6f42d36d3c0cb0d24ebc79e8114e10c4e5339e6736af0eb6b46c6a9",
            "services/aot/A19Converter/Exports.cs":"1b77997107a83ffb2d6f94cf90877b1dc55f0f848a6136f1a28f046d5bcdba29",
            "services/aot/A19Converter/InputValidation.cs":"988e33eece0142fb9dbc374a14dc334dccd37b79bcd93cd3c2a1d4250d2b1aed",
            "services/aot/A19Converter/Program.cs":"e2a34c72088b2acf89fbf63f7ae62780629516a60c0ab5bc4a8896beee3c8e96",
            "tools/a19-build-local.sh":"815174d33787ca907b8523345ac831b77a51a497d118bf60f8a4ec9e38582392"
          }
          for name,sha in expected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          (root/"A19CORE-IMPORT-AUDIT.json").write_text(json.dumps(expected,indent=2))
          # CS0136: avoid shadowing the existing checkpoint rejection flag.
          test=root/"a19-tests/converter-checkpoint.cs"
          data=test.read_bytes()
          old=b'bool rejected=false;try{A19Input.ValidateKeys(keys);}catch(InvalidDataException){rejected=true;}Check(rejected,"Invalid keys accepted");'
          assert data.count(old)==1
          data=data.replace(old,old.replace(b"rejected",b"keysRejected"))
          assert hashlib.sha256(data).hexdigest()=="964e59ca1b9aca1fc9967b1ba83083af71995d519c32d7437e7082154b94ecc3"
          test.write_bytes(data)
          expected["a19-tests/converter-checkpoint.cs"]=hashlib.sha256(data).hexdigest()
          (root/"A19CORE-IMPORT-AUDIT.json").write_text(json.dumps(expected,indent=2))
          print("Verified all eight corrected source files, including test scope fix.")
          PY
      - name: Restore verified stack and extraction recovery corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, json, hashlib, gzip, base64
          root=pathlib.Path("upstream")
          raw=gzip.decompress(base64.b64decode(pathlib.Path("project/a19core/fixes/stability-stage2.json.gz.b64").read_bytes().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=="f6c384135d0a93c6750e0049eb3450c122c5a9a34ae93c126e753501211a4372"
          ops=json.loads(raw)
          assert len(ops)==9
          result={}
          for name,(before,after,edits) in ops.items():
              rel=pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and ".." not in rel.parts
              p=root/rel
              data=p.read_bytes() if p.exists() else b""
              assert hashlib.sha256(data).hexdigest()==before,name
              for pos,size,insert in reversed(edits):
                  assert 0<=pos<=len(data) and 0<=size<=len(data)-pos,name
                  data=data[:pos]+insert.encode()+data[pos+size:]
              assert hashlib.sha256(data).hexdigest()==after,name
              result[name]=(p,data,after)
          for p,data,after in result.values():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          (root/"A19CORE-STABILITY.json").write_text(json.dumps({n:v[2] for n,v in result.items()},indent=2))
          print("Verified nine source files; stack regression and extraction checkpoint tests are required by the build.")
          PY
      - name: Verify reflection-free conversion and regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, hashlib, json
          root=pathlib.Path("upstream")
          checks={}
          def edit(name,before,after,replacements):
              p=root/name
              data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==before,name
              for old,new in replacements:
                  assert data.count(old.encode())==1,name
                  data=data.replace(old.encode(),new.encode())
              assert hashlib.sha256(data).hexdigest()==after,name
              p.write_bytes(data)
              checks[name]=after
          edit("services/aot/A19Converter/PackageCheckpoint.cs","d9222ac764f851e92efd98dd53e0ff8a297a42ca94a5b5b3e2a78511008dd38c","b05c4ba3b9cb2706fbfa6de1f515c2ba57855611428241822458bc2ec1fb6702",[
              ('        var data=JsonSerializer.SerializeToUtf8Bytes(new {abi=GeneratedVersion.HostAbi,romHash,romSize=new FileInfo(rom).Length,files=Inputs(root).Select(p=>new {path=Path.GetRelativePath(root,p),size=new FileInfo(p).Length,sha=ConverterFormats.Sha(p)}).ToArray()});',
               "        using var buffer=new MemoryStream();\n        using(var writer=new Utf8JsonWriter(buffer)){\n            writer.WriteStartObject();writer.WriteNumber(\"abi\",GeneratedVersion.HostAbi);writer.WriteString(\"romHash\",romHash);writer.WriteNumber(\"romSize\",new FileInfo(rom).Length);\n            writer.WriteStartArray(\"files\");foreach(string p in Inputs(root)){writer.WriteStartObject();writer.WriteString(\"path\",Path.GetRelativePath(root,p));writer.WriteNumber(\"size\",new FileInfo(p).Length);writer.WriteString(\"sha\",ConverterFormats.Sha(p));writer.WriteEndObject();}\n            writer.WriteEndArray();writer.WriteEndObject();writer.Flush();\n        }\n        byte[] data=buffer.ToArray();")])
          edit("a19-tests/converter-checkpoint.cs","d5fb8eee3a6fad925ecbe90187121c40bb28110ff828d2b4e23c972ff9911ec9","78c8253b4ec2e114a51086ea3c261dbe58e7e33f1ccba26d0727bfd75ed518ec",[
              ('            var meta=JsonSerializer.SerializeToUtf8Bytes(new Dictionary<string,object>{{"title_id",gid},{"host_abi",GeneratedVersion.HostAbi},{"rewriter_id",GeneratedVersion.Rewriter},{"image","image.dylib"},{"image_sha256",ConverterFormats.Sha(dylib)}});','            var meta=Json(w=>{w.WriteString("title_id",gid);w.WriteNumber("host_abi",GeneratedVersion.HostAbi);w.WriteString("rewriter_id",GeneratedVersion.Rewriter);w.WriteString("image","image.dylib");w.WriteString("image_sha256",ConverterFormats.Sha(dylib));});'),
              ('JsonSerializer.SerializeToUtf8Bytes(new Dictionary<string,string>{{"index_sha256",ConverterFormats.Sha(ix)}})','Json(w=>w.WriteString("index_sha256",ConverterFormats.Sha(ix)))'),
              ('    static void Main(){string root=','    static byte[] Json(Action<Utf8JsonWriter> write){using var m=new MemoryStream();using(var w=new Utf8JsonWriter(m)){w.WriteStartObject();write(w);w.WriteEndObject();}return m.ToArray();}\n    static void Main(){Check(!JsonSerializer.IsReflectionEnabledByDefault,"Tests must disable reflection-based JSON");string root=')])
          edit("a19-tests/ConverterTests.csproj","a46b9360c4508bab076ae71d7304636ff93b4ba7a334bf18f3ef848f5efa9694","9c35f5384238bf32a8ae28997934612629d4146480439cd3d6487e29aff277d4",[
              ('<OutputType>Exe</OutputType>','<OutputType>Exe</OutputType><JsonSerializerIsReflectionEnabledByDefault>false</JsonSerializerIsReflectionEnabledByDefault>')])
          for p in (root/"services/aot/A19Converter").glob("*.cs"):
              for line in p.read_text().splitlines():
                  if line.lstrip().startswith("//"): continue
                  assert "JsonSerializer.SerializeToUtf8Bytes" not in line,p
                  if "JsonSerializer.Serialize(" in line: assert "InspectJsonContext.Default.InspectResult" in line,p
          (root/"A19CORE-AOT-AUDIT.json").write_text(json.dumps(checks,indent=2))
          PY
      - name: Restore baseline compatibility and transactional resource recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, json, hashlib, gzip, base64
          root=pathlib.Path("upstream")
          raw=gzip.decompress(base64.b64decode(pathlib.Path("project/a19core/fixes/upstream-parity.json.gz.b64").read_bytes().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=="5ed5b15b63abb9c33b34d06fa4b63e364f560a726ca3172a71ee18b68759cd92"
          ops=json.loads(raw)
          assert len(ops)==6
          result={}
          for name,(before,after,edits) in ops.items():
              rel=pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and ".." not in rel.parts
              p=root/rel
              data=p.read_bytes() if p.exists() else b""
              assert hashlib.sha256(data).hexdigest()==before,name
              lines=data.splitlines(True)
              for i,j,insert in reversed(edits):
                  lines[i:j]=[insert.encode()]
              data=b"".join(lines)
              assert hashlib.sha256(data).hexdigest()==after,name
              result[name]=(p,data,after)
          for p,data,after in result.values():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          (root/"A19CORE-UPSTREAM-PARITY.json").write_text(json.dumps({n:v[2] for n,v in result.items()},indent=2))
          PY
      - name: Gate expensive build on upstream byte parity and reflection-free recovery
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.402
          unset S2A_APPLE_OS
          export A19_PARITY_DIR="$(mktemp -d)"
          python a19-tests/upstream-parity.py "$PWD" "$A19_PARITY_DIR"
          dotnet run --project a19-tests/ConverterTests.csproj -c Release
      - name: Prepare Apple Silicon and pinned dependencies
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for pair in gmake:make ninja:ninja meson:meson cmake:cmake rg:ripgrep; do
            command -v "${pair%:*}" >/dev/null || brew install "${pair#*:}"
          done
          xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
          python runtime/rewriter/prepare_deps.py "$RUNNER_TEMP/a19core-deps"
          python tools/a19-preflight.py --deps "$RUNNER_TEMP/a19core-deps"
      - name: Fix Darwin file-open feature visibility and check SDK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, json
          p = pathlib.Path("runtime/src/a19_image.c")
          original = p.read_bytes()
          marker = b"#define _POSIX_C_SOURCE 200809L\n"
          assert original.startswith(marker)
          fixed = b"#ifdef __APPLE__\n#define _DARWIN_C_SOURCE 1\n#endif\n" + original
          p.write_bytes(fixed)
          pathlib.Path("A19CORE-BUILD-FIXES.json").write_text(json.dumps({"runtime/src/a19_image.c":{"before":hashlib.sha256(original).hexdigest(),"after":hashlib.sha256(fixed).hexdigest(),"reason":"Expose Darwin O_NOFOLLOW without dropping symlink protection"}}, indent=2))
          PY
          printf '#define _DARWIN_C_SOURCE 1\n#define _POSIX_C_SOURCE 200809L\n#include <fcntl.h>\nint flags = O_NOFOLLOW | O_DIRECTORY;\n' | xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=26.0 -x c -fsyntax-only -
      - name: Compile exact A19Core integrated source
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DOTNET_ROOT:$PATH"
          mkdir -p "$RUNNER_TEMP/a19core-out"
          bash tools/a19-build-local.sh --build "$RUNNER_TEMP/a19core-deps" "$RUNNER_TEMP/a19core-out/A19Core-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: A19Core-iPhone17-unsigned
          path: ${{ runner.temp }}/a19core-out/A19Core-unsigned.ipa
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A19Core-checkpoint-build-diagnostics
          path: |
            ${{ runner.temp }}/a19core-out/*.log
            upstream/build/rewriter-symbols.txt
            upstream/A19CORE-WORK-STATE.json
            upstream/A19CORE-BUILD-FIXES.json
            upstream/A19CORE-IMPORT-AUDIT.json
            upstream/A19CORE-STABILITY.json
            upstream/A19CORE-AOT-AUDIT.json
            upstream/A19CORE-UPSTREAM-PARITY.json
          if-no-files-found: ignore
