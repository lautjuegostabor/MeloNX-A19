name: A19Core exact checkpoint - iPhone 17
on:
  workflow_dispatch:
  push:
    branches: [a19core-native-integration]
    paths: ['A19Core-source-transfer.txt', '.github/workflows/a19core-checkpoint-build.yml']
permissions:
  contents: read
concurrency:
  group: a19core-checkpoint-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          sparse-checkout: |
            A19Core-source-transfer.txt
            a19core/fixes/import-audit.patch.gz.b64
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: jhaizhou-ops/S2Arm
          ref: 39d35671a57ee30d5f528c13d206fd6309a84b8f
          path: upstream
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and restore exact A19Core source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 39d35671a57ee30d5f528c13d206fd6309a84b8f
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path("upstream")
          payload = "".join(pathlib.Path("project/A19Core-source-transfer.txt").read_text().split()).encode()
          assert hashlib.sha256(payload).hexdigest() == "ab2f034033da7a3ac725bfedee4236c47418c5af238bc92f78ee2807840cbf82", "Incorrect transfer payload"
          transfer = json.loads(zlib.decompress(base64.b64decode(payload, validate=True)))
          manifest = json.loads(transfer["manifest"])
          expected = manifest["modified"] | manifest["added"]
          assert len(expected) == 58 and set(expected) == set(transfer["ops"])
          def safe_path(name):
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and ".." not in p.parts
              return root / p
          # Read all originals before applying any edits.
          reconstructed = {}
          for name, (source, edits, digest) in transfer["ops"].items():
              assert digest == expected[name]
              if source:
                  lines = safe_path(source).read_bytes().splitlines(True)
                  for i, j, encoded in reversed(edits):
                      lines[i:j] = [base64.b64decode(encoded, validate=True)]
                  value = b"".join(lines)
              else:
                  value = base64.b64decode(edits, validate=True)
              assert hashlib.sha256(value).hexdigest() == digest, name
              reconstructed[name] = value
          assert manifest["removed"] == ["runtime/src/imgpack.c"]
          for name in manifest["removed"]:
              safe_path(name).unlink()
          for name, value in reconstructed.items():
              p = safe_path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(value)
          (root / "A19CORE-WORK-STATE.json").write_text(transfer["manifest"])
          for name, digest in expected.items():
              assert hashlib.sha256(safe_path(name).read_bytes()).hexdigest() == digest
          print("Restored exact production checkpoint; 58 per-file hashes verified.")
          PY
      - name: Apply verified import and converter audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,base64,gzip,pathlib
          transfer=pathlib.Path("project/a19core/fixes/import-audit.patch.gz.b64").read_bytes()
          assert hashlib.sha256(transfer).hexdigest()=="c407e380c2a96ca7425b6742c14e7cc2f6b42b71693484839bc080945f603293"
          patch=gzip.decompress(base64.b64decode(transfer.strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=="6ade5a79d8a8f7516c8ec38626baab79c5b7f8271071f1846744dca5311972d7"
          pathlib.Path("import-audit.patch").write_bytes(patch)
          PY
          (cd upstream && git apply --check ../import-audit.patch && git apply ../import-audit.patch)
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("upstream")
          expected={
            "a19-tests/ConverterTests.csproj":"a46b9360c4508bab076ae71d7304636ff93b4ba7a334bf18f3ef848f5efa9694",
            "a19-tests/converter-checkpoint.cs":"1579b439c9731c2f05abe1782f9dbd7fd56046c24ae497a79f0b91063cf469e5",
            "ios/A19Library.m":"e944435288e7d0259744641762078171e87bbfb25527b5e02891956838a6963e",
            "services/aot/A19Converter/ConvertJob.cs":"7bcfbdb9b6f42d36d3c0cb0d24ebc79e8114e10c4e5339e6736af0eb6b46c6a9",
            "services/aot/A19Converter/Exports.cs":"1b77997107a83ffb2d6f94cf90877b1dc55f0f848a6136f1a28f046d5bcdba29",
            "services/aot/A19Converter/InputValidation.cs":"988e33eece0142fb9dbc374a14dc334dccd37b79bcd93cd3c2a1d4250d2b1aed",
            "services/aot/A19Converter/Program.cs":"e2a34c72088b2acf89fbf63f7ae62780629516a60c0ab5bc4a8896beee3c8e96",
            "tools/a19-build-local.sh":"815174d33787ca907b8523345ac831b77a51a497d118bf60f8a4ec9e38582392"
          }
          for name,sha in expected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          (root/"A19CORE-IMPORT-AUDIT.json").write_text(json.dumps(expected,indent=2))
          # CS0136: avoid shadowing the existing checkpoint rejection flag.
          test=root/"a19-tests/converter-checkpoint.cs"
          data=test.read_bytes()
          old=b'bool rejected=false;try{A19Input.ValidateKeys(keys);}catch(InvalidDataException){rejected=true;}Check(rejected,"Invalid keys accepted");'
          assert data.count(old)==1
          data=data.replace(old,old.replace(b"rejected",b"keysRejected"))
          assert hashlib.sha256(data).hexdigest()=="964e59ca1b9aca1fc9967b1ba83083af71995d519c32d7437e7082154b94ecc3"
          test.write_bytes(data)
          expected["a19-tests/converter-checkpoint.cs"]=hashlib.sha256(data).hexdigest()
          (root/"A19CORE-IMPORT-AUDIT.json").write_text(json.dumps(expected,indent=2))
          print("Verified all eight corrected source files, including test scope fix.")
          PY
      - name: Prepare Apple Silicon and pinned dependencies
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for pair in gmake:make ninja:ninja meson:meson cmake:cmake rg:ripgrep; do
            command -v "${pair%:*}" >/dev/null || brew install "${pair#*:}"
          done
          xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
          python runtime/rewriter/prepare_deps.py "$RUNNER_TEMP/a19core-deps"
          python tools/a19-preflight.py --deps "$RUNNER_TEMP/a19core-deps"
      - name: Fix Darwin file-open feature visibility and check SDK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, json
          p = pathlib.Path("runtime/src/a19_image.c")
          original = p.read_bytes()
          marker = b"#define _POSIX_C_SOURCE 200809L\n"
          assert original.startswith(marker)
          fixed = b"#ifdef __APPLE__\n#define _DARWIN_C_SOURCE 1\n#endif\n" + original
          p.write_bytes(fixed)
          pathlib.Path("A19CORE-BUILD-FIXES.json").write_text(json.dumps({"runtime/src/a19_image.c":{"before":hashlib.sha256(original).hexdigest(),"after":hashlib.sha256(fixed).hexdigest(),"reason":"Expose Darwin O_NOFOLLOW without dropping symlink protection"}}, indent=2))
          PY
          printf '#define _DARWIN_C_SOURCE 1\n#define _POSIX_C_SOURCE 200809L\n#include <fcntl.h>\nint flags = O_NOFOLLOW | O_DIRECTORY;\n' | xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=26.0 -x c -fsyntax-only -
      - name: Compile exact A19Core integrated source
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DOTNET_ROOT:$PATH"
          mkdir -p "$RUNNER_TEMP/a19core-out"
          bash tools/a19-build-local.sh --build "$RUNNER_TEMP/a19core-deps" "$RUNNER_TEMP/a19core-out/A19Core-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: A19Core-iPhone17-unsigned
          path: ${{ runner.temp }}/a19core-out/A19Core-unsigned.ipa
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A19Core-checkpoint-build-diagnostics
          path: |
            ${{ runner.temp }}/a19core-out/*.log
            upstream/build/rewriter-symbols.txt
            upstream/A19CORE-WORK-STATE.json
            upstream/A19CORE-BUILD-FIXES.json
            upstream/A19CORE-IMPORT-AUDIT.json
          if-no-files-found: ignore
