name: A19Core native lane (component integration)
on:
  workflow_dispatch:
  push:
    branches: [a19core-native-integration]
    paths: ['.github/workflows/a19core-native-integration.yml']
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=a19core-native -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
        with:
          repository: jhaizhou-ops/S2Arm
          ref: 39d35671a57ee30d5f528c13d206fd6309a84b8f
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reused AOT compiler
        run: |
          set -euxo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python upstream/runtime/rewriter/prepare_deps.py "$RUNNER_TEMP/deps"
          # The converter previously hit Capstone's CPack packaging metadata.
          # Disable its packaging include without changing the decoder.
          python - "$RUNNER_TEMP/deps/capstone-5.0.7/src/CMakeLists.txt" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text()
          p.write_text(re.sub(r'(?im)^\s*include\s*\(\s*CPack\s*\)\s*$', '', s))
          PY
          cmake -S upstream/runtime/rewriter -B "$RUNNER_TEMP/rew" -DS2A_REWRITER_DEPS="$RUNNER_TEMP/deps" -DS2A_REWRITER_API_TEST=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/rew" --parallel 3
          mkdir -p "$RUNNER_TEMP/a19"
      - name: Compile and rewrite original ARM64 fixture
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/a19"
          cat > guest.S <<'EOF'
          .text
          .globl _guest
          _guest:
            ldr x3, [x2]
            add x0, x0, x1
            eor x0, x0, x3
            str x0, [x2]
            ret
          EOF
          xcrun clang -target arm64-apple-macos15 -c guest.S -o guest.o
          python - <<'PY'
          import struct,pathlib
          # Read __TEXT,__text from a genuine clang-assembled ARM64 object.
          b=pathlib.Path('guest.o').read_bytes()
          assert struct.unpack_from('<I',b)[0]==0xfeedfacf
          p=32; code=None
          for i in range(struct.unpack_from('<I',b,16)[0]):
              cmd,sz=struct.unpack_from('<II',b,p)
              if cmd==0x19:
                  for k in range(struct.unpack_from('<I',b,p+64)[0]):
                      q=p+72+80*k
                      if b[q:q+16].rstrip(b'\0')==b'__text':
                          n,off=struct.unpack_from('<QI',b,q+40);code=b[off:off+n]
              p+=sz
          assert code and len(code)==20
          # Public NSO layout + minimal MOD0/FDE, based on upstream test fixture.
          t=bytearray(4096);struct.pack_into('<II',t,0,0x14000040,4096);t[256:256+len(code)]=code
          ro=bytearray(4096);struct.pack_into('<4sIIIii',ro,0,b'MOD0',0,0,0,256,288)
          struct.pack_into('<BBBBiIii',ro,256,1,0x1b,3,0x3b,0xfc,1,-4096,0x118)
          ro[512:536]=struct.pack('<II',20,0)+bytes([1])+b'zR\0'+bytes([4,0x78,30,1,0x1b])+bytes(7)
          f=4096+536;struct.pack_into('<IIii',ro,536,16,28,256-(f+8),len(code))
          h=bytearray(256);h[:4]=b'NSO0'
          for i in range(3):
              struct.pack_into('<III',h,16+i*16,256+i*4096,i*4096,4096)
              struct.pack_into('<I',h,0x60+i*4,4096)
          h[0x40:0x50]=bytes(range(16))
          pathlib.Path('fixture.nso').write_bytes(h+t+ro+bytes(4096))
          pathlib.Path('guest.raw').write_bytes(code)
          PY
          mkdir rewritten
          S2A_TARGET=ios "$RUNNER_TEMP/rew/s2a-rewrite" fixture.nso rewritten main
          python - <<'PY'
          import pathlib
          original=pathlib.Path('guest.raw').read_bytes()
          patched=pathlib.Path('rewritten/main.patched.bin').read_bytes()
          assert patched[256:256+len(original)]==original, 'Fixture requires runtime gates; not safe for leaf lane'
          pathlib.Path('direct.S').write_text('.text\n.p2align 2\n.globl _a19_direct\n_a19_direct:\n'+''.join('.long 0x%08x\n'%int.from_bytes(original[i:i+4],'little') for i in range(0,len(original),4)))
          PY
      - name: Actual ARM64 execution and Metal 4 integration
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/a19"
          cat > native.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <stdint.h>
          #include <stdio.h>
          extern uint64_t a19_direct(uint64_t,uint64_t,uint64_t*);
          int a19_cpu(void) {
            uint64_t v=0x12345678, a=0xFFFFFFFFFFFFFFF0ULL;
            for(unsigned i=0;i<100000;i++){
              uint64_t want=(a+i)^v;
              if(a19_direct(a,i,&v)!=want||v!=want)return 1;
              a=a*6364136223846793005ULL+1;
            }
            return 0;
          }
          NSString *a19_gpu(void) {
            id<MTLDevice> d=MTLCreateSystemDefaultDevice();
            if(!d)return @"NO GPU";
            NSError *e=nil;
            id<MTLLibrary> lib=[d newLibraryWithSource:@"#include <metal_stdlib>\nusing namespace metal;\nkernel void k(device uint *x [[buffer(0)]], uint i [[thread_position_in_grid]]) { x[i]=i*3+7; }" options:nil error:&e];
            if(!lib)return e.localizedDescription?:@"library failure";
            MTL4LibraryFunctionDescriptor *f=[MTL4LibraryFunctionDescriptor new];f.library=lib;f.name=@"k";
            MTL4ComputePipelineDescriptor *pd=[MTL4ComputePipelineDescriptor new];pd.computeFunctionDescriptor=f;
            id<MTL4Compiler> comp=[d newCompilerWithDescriptor:[MTL4CompilerDescriptor new] error:&e];
            if(!comp)return e.localizedDescription?:@"compiler failure";
            id<MTLComputePipelineState> ps=[comp newComputePipelineStateWithDescriptor:pd dynamicLinkingDescriptor:nil compilerTaskOptions:nil error:&e];
            if(!ps)return e.localizedDescription?:@"pipeline failure";
            id<MTL4CommandQueue> q=[d newMTL4CommandQueue];
            id<MTL4CommandAllocator> a=[d newCommandAllocatorWithDescriptor:[MTL4CommandAllocatorDescriptor new] error:&e];
            id<MTL4CommandBuffer> cb=[d newCommandBuffer];
            id<MTLBuffer> b=[d newBufferWithLength:4096 options:MTLResourceStorageModeShared];
            id<MTLResidencySet> rs=[d newResidencySetWithDescriptor:[MTLResidencySetDescriptor new] error:&e];
            MTL4ArgumentTableDescriptor *ad=[MTL4ArgumentTableDescriptor new];ad.maxBufferBindCount=1;
            id<MTL4ArgumentTable> at=[d newArgumentTableWithDescriptor:ad error:&e];
            id<MTLSharedEvent> ev=[d newSharedEvent];
            if(!q||!a||!cb||!b||!rs||!at||!ev)return @"resource failure";
            [rs addAllocation:b];[rs commit];[q addResidencySet:rs];
            [at setAddress:b.gpuAddress atIndex:0];
            [cb beginCommandBufferWithAllocator:a];
            id<MTL4ComputeCommandEncoder> enc=[cb computeCommandEncoder];
            if(!enc)return @"encoder failure";
            [enc setComputePipelineState:ps];[enc setArgumentTable:at];
            [enc dispatchThreads:MTLSizeMake(1024,1,1) threadsPerThreadgroup:MTLSizeMake(32,1,1)];
            [enc endEncoding];[cb endCommandBuffer];
            [q commit:&cb count:1];[q signalEvent:ev value:1];
            if(![ev waitUntilSignaledValue:1 timeoutMS:10000])return @"GPU timeout";
            const uint32_t *p=b.contents;for(unsigned i=0;i<1024;i++)if(p[i]!=i*3+7)return @"GPU mismatch";
            return @"PASS";
          }
          #ifndef A19_IOS
          int main(void){@autoreleasepool{int rc=a19_cpu();printf("100000 ARM64 native calls: %s\n",rc?"FAIL":"PASS");return rc;}}
          #endif
          EOF
          xcrun clang -target arm64-apple-macos26 -fobjc-arc native.m direct.S -framework Foundation -framework Metal -o native-test
          ./native-test
          # Device SDK build, not a device execution. No signed or downloaded code.
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -fobjc-arc -DA19_IOS -c native.m -o native-ios.o
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -c direct.S -o direct-ios.o
          xcrun lipo -info native-ios.o
          xcrun lipo -info direct-ios.o
      - uses: actions/upload-artifact@v4
        with:
          name: a19core-native-components
          path: |
            ${{ runner.temp }}/a19/native.m
            ${{ runner.temp }}/a19/direct.S
            ${{ runner.temp }}/a19/native-ios.o
            ${{ runner.temp }}/a19/direct-ios.o
            ${{ runner.temp }}/a19/rewritten/main.fixups.tsv
          if-no-files-found: error
      - name: Report outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure; [ "$RESULT" = success ] && state=success
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=a19core-native -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
