          # A standard RomFS with a real file, crossing the 4 MiB buffer.
          data=bytes(range(256))*20000
          name=b"sample.bin"; dirs=struct.pack("<6I",0xffffffff,0xffffffff,0xffffffff,0,0xffffffff,0)
          files=struct.pack("<IIQQII",0,0xffffffff,0,len(data),0xffffffff,len(name))+name+b"\0\0"
          at=80+len(dirs)+len(files)
          rom=struct.pack("<10Q",80,0,0,80,len(dirs),0,0,80+len(dirs),len(files),at)+dirs+files+data
          (p/"rom.std").write_bytes(rom);(p/"rom.reference").write_bytes(rom)
          (p/"main.npdm").write_bytes(b"fixture NPDM")
          PY
          dotnet restore "$T/host/host.csproj" --configfile "$T/host/nuget.config"
          dotnet run --project "$T/host/host.csproj" -c Release --no-restore -- "$T/fixture"
          python3 "$UPSTREAM/ios/embed.py" "$T/fixture" "$T/fixture/expected.dylib" main subsdk0 subsdk9 sdk
          cmp "$T/fixture/S2AImages-0100123456789000.dylib" "$T/fixture/expected.dylib"
          python3 - "$T/fixture" <<'PY'
          import hashlib,json,pathlib,struct,sys,tarfile
          p=pathlib.Path(sys.argv[1])
          sha=lambda b: hashlib.sha256(b).hexdigest()
          with tarfile.open(p/"game.tar","r:") as t:
              items=t.getmembers()
              assert items[0].name=="s2arm.json" and all(x.isfile() for x in items)
              read=lambda n:t.extractfile(n).read()
              head=json.loads(read("s2arm.json")); cat=json.loads(read("program/catalogue.json"))
              assert head["format"]=="s2arm" and head["schema"]==cat["schema"]==1
              assert head["title_id"]==cat["title_id"]=="0100123456789000"
              assert head["rewriter_id"]==cat["rewriter_id"] and len(cat["rewriter_id"])==16
              assert head["image_sha256"]==cat["image_sha256"]==sha(read("program/"+cat["image"]))
              assert head["bytes"]==sum(x.size for x in items[1:])
              ix=read("pack/index.tsv"); mf=json.loads(read("pack/manifest.json"))
              assert head["pack"]==mf["index_sha256"]==sha(ix)
              assert (p/"game.s2arm").read_bytes()[:4]==bytes.fromhex("28b52ffd")
              assert (p/"game.s2arm").read_bytes()[4]&4, "Zstd frame checksum missing"
              b=(p/"game.img").read_bytes()
              magic,ver,_,gid,pid,ro,rs,to,ts,total=struct.unpack_from("<8sII16s64s5Q",b)
              assert magic==b"S2AIMG01" and ver==1 and total==len(b) and gid.decode()==cat["title_id"]
              assert ix.decode()==f"game.img\t{total}\t{pid.decode()}\n"
              assert b[ro:ro+rs]==(p/"rom.reference").read_bytes()
              slots,count=struct.unpack_from("<II",b,to)
              names={}
              for i in range(slots):
                  h,o,n,po,pn=struct.unpack_from("<QQQII",b,to+8+32*i)
                  if h: names[b[to+8+32*slots+po:to+8+32*slots+po+pn].decode()]=b[o:o+n]
              assert count==2 and names=={"exefs/main.npdm":b"fixture NPDM","romfs.list":b"sample.bin\n"}
          print("Full managed package fixture, vendored dependencies, multi-module Mach-O, nonempty RomFS, TAR and zstd checksum passed")
          PY
          S2ARM_SOURCE_EOF
      - name: Check binary formats against upstream
        shell: bash
        run: bash "$RUNNER_TEMP/s2arm-port/test-formats.sh" "$GITHUB_WORKSPACE/upstream"
      - name: Install iOS workload and compile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/s2arm-port"
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          [[ "$XCODE_VERSION" == "Xcode 27.1"* ]]
          test "$(dotnet --version)" = 10.0.402
          # Official .NET 10 release supporting Xcode 27.1, no validation bypass.
          dotnet workload install ios --version 10.0.402.1
          dotnet workload --info
          test -d "$DOTNET_ROOT/packs/Microsoft.iOS.Sdk.net10.0_27.1/27.1.10018"
          bash build.sh "$GITHUB_WORKSPACE/upstream"
      - uses: actions/upload-artifact@v4
        with:
          name: S2ArmConverter-unsigned
          path: ${{ runner.temp }}/s2arm-port/dist/*.ipa
          if-no-files-found: error
      - name: Report final build status and run link
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in success) state=success;; failure) state=failure;; *) state=error;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=s2arm-converter -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Converter build $RESULT"
